<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27272a"/>
      <stop offset="100%" style="stop-color:#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <linearGradient id="emeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857"/>
      <stop offset="100%" style="stop-color:#065f46"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)"/>
  
  <!-- Crystalline "A" letterform -->
  <g transform="translate(256, 270)">
    <!-- Left facet of A (darker) -->
    <polygon points="-120,130 0,-170 0,130" fill="url(#emeraldDark)"/>
    
    <!-- Right facet of A (lighter) -->
    <polygon points="120,130 0,-170 0,130" fill="url(#emeraldGrad)"/>
    
    <!-- Crossbar as amber accent -->
    <polygon points="-70,50 70,50 55,20 -55,20" fill="#f59e0b"/>
    
    <!-- Top highlight edge -->
    <polygon points="0,-170 -8,-150 8,-150" fill="#6ee7b7" opacity="0.6"/>
    
    <!-- Inner triangle cutout (negative space) -->
    <polygon points="0,130 -50,130 0,30 50,130" fill="#18181b"/>
  </g>
</svg>
